<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real or Fake - Daily</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 27, 46, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --real: #10b981;
      --fake: #f43f5e;
      --fire: #f97316;
      --whatsapp: #25d366;
      --x-corp: #0f1419;
      --shadow-glow: rgba(56, 189, 248, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 10%, #1e1b4b 0%, var(--bg) 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .container {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      max-width: 440px;
      width: 100%;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 40px var(--shadow-glow);
      text-align: center;
      position: relative;
    }
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 99px;
      transition: width 0.4s ease;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .badges {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .tag {
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 4px 10px;
      border-radius: 99px;
    }
    .streak-badge {
      background: rgba(249, 115, 22, 0.15);
      color: var(--fire);
      border: 1px solid rgba(249, 115, 22, 0.3);
      padding: 4px 10px;
      border-radius: 99px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .img-box {
      width: 100%;
      height: 290px;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 18px;
      background: #020617;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.05);
      cursor: zoom-in;
    }
    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.25s ease;
    }
    .zoom-hint {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 0.75rem;
      color: #cbd5e1;
      pointer-events: none;
    }
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    button {
      border: none;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    button:active { transform: scale(0.96); }
    .btn-real {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25);
    }
    .btn-fake {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      color: #fff;
      box-shadow: 0 4px 15px rgba(244, 63, 94, 0.25);
    }
    .result-box {
      padding: 14px;
      border-radius: 14px;
      font-size: 0.95rem;
      display: none;
      margin-top: 10px;
      line-height: 1.5;
      text-align: left;
    }
    .result-box.correct {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #a7f3d0;
    }
    .result-box.wrong {
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fecdd3;
    }
    .next-btn {
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #fff;
      width: 100%;
      margin-top: 14px;
      display: none;
    }
    .emoji-row {
      letter-spacing: 6px;
      font-size: 1.4rem;
      margin: 14px 0;
      background: rgba(0,0,0,0.25);
      padding: 12px;
      border-radius: 12px;
    }
    .timer-box {
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 10px;
    }
    .timer-val {
      font-family: monospace;
      font-size: 1.2rem;
      color: var(--accent);
      font-weight: 700;
      margin-top: 2px;
    }

    /* İstatistik Tablosu */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 16px 0;
    }
    .stat-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 10px 6px;
    }
    .stat-number {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text);
    }
    .stat-label {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Paylaşım Butonları Grubu */
    .share-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }
    .share-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .share-btn-copy {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
    }
    .share-btn-x {
      background: #000;
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .share-btn-wa {
      background: #128c7e;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Modal / Lightbox */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    .modal img {
      max-width: 92%;
      max-height: 85%;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake { animation: shake 0.4s ease; }
  </style>
</head>
<body>

<div class="container" id="gameContainer">
  <div class="progress-bar-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="header">
    <div class="badges">
      <span class="tag" id="dayIndicator">Gün #1</span>
      <span class="streak-badge" id="streakBadge">🔥 <span id="streakCount">0</span></span>
    </div>
    <span id="questionTracker" style="color: var(--muted);">Soru 1/10</span>
  </div>

  <div class="img-box" onclick="openModal()">
    <span class="zoom-hint">🔍 Yakınlaştır</span>
    <img id="quizImage" src="" alt="Soru Görseli">
  </div>

  <div class="btn-group" id="actions">
    <button class="btn-real" onclick="checkAnswer(true)">GERÇEK</button>
    <button class="btn-fake" onclick="checkAnswer(false)">YAPAY ZEKA</button>
  </div>

  <div class="result-box" id="explanationBox"></div>
  <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Sonraki Soru &rarr;</button>
</div>

<div class="modal" id="imageModal" onclick="closeModal()">
  <img id="modalImg" src="" alt="Tam Ekran İnceleme">
</div>

<script>
  // --- SES MOTORU ---
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(isCorrect) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (isCorrect) {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
      osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.35);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    }
  }

  // --- TARİH VE GÜN HESABI ---
  const START_DATE = new Date("2026-09-28");
  const today = new Date();
  const diffTime = Math.max(0, today - START_DATE);
  const currentDayNumber = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;
  const storageKey = `daily_real_fake_day_${currentDayNumber}`;

  // --- SORU LİSTESİ ---
  const questions = [
    { image: "https://images.unsplash.com/photo-1617814076367-b759c7d7e738?w=800", isReal: true, explanation: "Gerçek: Porsche Taycan elektrikli spor sedan." },
    { image: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=800", isReal: false, explanation: "Yapay Zeka: Arka plan detayları ve ışık kırılmaları sentetik." },
    { image: "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=800", isReal: true, explanation: "Gerçek: Chevrolet Corvette Stingray C8." },
    { image: "https://images.unsplash.com/photo-1542282088-72c9c27ed0cd?w=800", isReal: true, explanation: "Gerçek: Klasik Porsche 911 hava soğutmalı model." },
    { image: "https://images.unsplash.com/photo-1563720223185-11003d516935?w=800", isReal: false, explanation: "Yapay Zeka: Jant tellerindeki asimetri ve far içi difüzyon AI üretimi." },
    { image: "https://images.unsplash.com/photo-1583121274602-3e2820c69888?w=800", isReal: true, explanation: "Gerçek: Ferrari 488 Pista pist odaklı süper otomobil." },
    { image: "https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?w=800", isReal: true, explanation: "Gerçek: Mercedes-AMG GT Coupe." },
    { image: "https://images.unsplash.com/photo-1511919884226-fd3cad34687c?w=800", isReal: false, explanation: "Yapay Zeka: Arka kanat aerodinamiği ve difüzör hatları hayali tasarım." },
    { image: "https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2?w=800", isReal: true, explanation: "Gerçek: Tesla Model 3 Long Range." },
    { image: "https://images.unsplash.com/photo-1508974239320-0a029497e820?w=800", isReal: false, explanation: "Yapay Zeka: Izgara deseni ve kaput çizgilerinde AI piksellenmesi var." }
  ];

  let currentIndex = 0;
  let score = 0;
  let resultsHistory = [];

  // --- STATS VE STREAK YÖNETİMİ ---
  function getStats() {
    const raw = localStorage.getItem("rf_global_stats");
    return raw ? JSON.parse(raw) : { played: 0, totalQuestions: 0, totalCorrect: 0, maxStreak: 0 };
  }

  function updateUserData(currentScore) {
    let streak = parseInt(localStorage.getItem("rf_streak") || "0");
    const lastPlayedDay = parseInt(localStorage.getItem("rf_last_day") || "0");

    if (lastPlayedDay === currentDayNumber - 1) {
      streak += 1;
    } else if (lastPlayedDay < currentDayNumber - 1 && lastPlayedDay !== 0) {
      streak = 1;
    } else if (lastPlayedDay === 0) {
      streak = 1;
    }

    const stats = getStats();
    stats.played += 1;
    stats.totalQuestions += questions.length;
    stats.totalCorrect += currentScore;
    stats.maxStreak = Math.max(stats.maxStreak, streak);

    localStorage.setItem("rf_streak", streak);
    localStorage.setItem("rf_last_day", currentDayNumber);
    localStorage.setItem("rf_global_stats", JSON.stringify(stats));

    return { streak, stats };
  }

  const currentStreak = localStorage.getItem("rf_streak") || 0;
  document.getElementById("streakCount").innerText = currentStreak;

  // --- MODAL ZOOM ---
  function openModal() {
    const modal = document.getElementById("imageModal");
    document.getElementById("modalImg").src = document.getElementById("quizImage").src;
    modal.style.display = "flex";
  }
  function closeModal() {
    document.getElementById("imageModal").style.display = "none";
  }

  // --- GERİ SAYIM ---
  function startCountdown() {
    function tick() {
      const now = new Date();
      const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
      const diff = tomorrow - now;

      const hours = String(Math.floor((diff / (1000 * 60 * 60)) % 24)).padStart(2, '0');
      const minutes = String(Math.floor((diff / 1000 / 60) % 60)).padStart(2, '0');
      const seconds = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');

      const el = document.getElementById("countdown");
      if (el) el.innerText = `${hours}:${minutes}:${seconds}`;
    }
    tick();
    setInterval(tick, 1000);
  }

  // --- BİTİŞ EKRANI & PAYLAŞIM ---
  function generateShareText(finalScore, emojis, streak) {
    return `Real or Fake #${currentDayNumber} 🔥 ${streak} Günlük Seri\nSkor: ${finalScore}/${questions.length}\n${emojis}`;
  }

  function shareResultCopy(finalScore, emojis, streak) {
    const text = generateShareText(finalScore, emojis, streak);
    navigator.clipboard.writeText(text).then(() => {
      alert("Sonuç panoya kopyalandı! Dilediğin yere yapıştırabilirsin.");
    });
  }

  function shareTwitter(finalScore, emojis, streak) {
    const text = encodeURIComponent(generateShareText(finalScore, emojis, streak));
    window.open(`https://twitter.com/intent/tweet?text=${text}`, '_blank');
  }

  function shareWhatsApp(finalScore, emojis, streak) {
    const text = encodeURIComponent(generateShareText(finalScore, emojis, streak));
    window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
  }

  function renderFinishedScreen(finalScore, history, streak, stats) {
    const emojis = history.join("");
    const accuracy = stats.totalQuestions > 0 ? Math.round((stats.totalCorrect / stats.totalQuestions) * 100) : 0;

    document.getElementById("gameContainer").innerHTML = `
      <div class="badges" style="justify-content:center; margin-bottom:10px;">
        <span class="tag">Gün #${currentDayNumber}</span>
        <span class="streak-badge">🔥 ${streak} Gün Seri</span>
      </div>
      <h2 style="font-size:1.5rem; margin-bottom: 4px;">Günün Testi Bitti!</h2>
      <div style="font-size:2.6rem; margin: 8px 0; font-weight:900; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
        ${finalScore} / ${questions.length}
      </div>
      <div class="emoji-row">${emojis}</div>

      <!-- İstatistikler -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-number">${stats.played}</div>
          <div class="stat-label">Oyun</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">%${accuracy}</div>
          <div class="stat-label">Başarı</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">${stats.maxStreak}</div>
          <div class="stat-label">En İyi Seri</div>
        </div>
      </div>

      <div class="timer-box">
        <div style="font-size:0.75rem; color:var(--muted); text-transform: uppercase;">YENİ TESTE KALAN SÜRE</div>
        <div class="timer-val" id="countdown">--:--:--</div>
      </div>

      <!-- Paylaşım Butonları -->
      <div class="share-group">
        <button class="share-btn-copy" onclick="shareResultCopy('${finalScore}', '${emojis}', ${streak})">Sonucu Kopyala 📋</button>
        <div class="share-row">
          <button class="share-btn-x" onclick="shareTwitter('${finalScore}', '${emojis}', ${streak})">𝕏'te Paylaş</button>
          <button class="share-btn-wa" onclick="shareWhatsApp('${finalScore}', '${emojis}', ${streak})">WhatsApp</button>
        </div>
      </div>
    `;
    startCountdown();
  }

  // --- AKIŞ KONTROLÜ ---
  const savedState = localStorage.getItem(storageKey);
  if (savedState) {
    const parsed = JSON.parse(savedState);
    const streak = localStorage.getItem("rf_streak") || 1;
    const stats = getStats();
    renderFinishedScreen(parsed.score, parsed.history, streak, stats);
  } else {
    document.getElementById("dayIndicator").innerText = `Gün #${currentDayNumber}`;
    loadQuestion();
  }

  function loadQuestion() {
    const q = questions[currentIndex];
    const imgEl = document.getElementById("quizImage");
    imgEl.style.opacity = "0";
    setTimeout(() => {
      imgEl.src = q.image;
      imgEl.style.opacity = "1";
    }, 150);

    const progressPercent = ((currentIndex + 1) / questions.length) * 100;
    document.getElementById("progressBar").style.width = `${progressPercent}%`;
    document.getElementById("questionTracker").innerText = `Soru ${currentIndex + 1}/${questions.length}`;
    
    const expBox = document.getElementById("explanationBox");
    expBox.style.display = "none";
    expBox.className = "result-box";
    
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("actions").style.display = "grid";
    document.getElementById("gameContainer").classList.remove("shake");
  }

  function checkAnswer(userChoice) {
    const q = questions[currentIndex];
    const isCorrect = (userChoice === q.isReal);
    const container = document.getElementById("gameContainer");
    const expBox = document.getElementById("explanationBox");

    playSound(isCorrect);

    if (isCorrect) {
      score++;
      resultsHistory.push("🟩");
      expBox.className = "result-box correct";
      expBox.innerHTML = `<strong>Doğru Bildin! ✨</strong><br>${q.explanation}`;
    } else {
      resultsHistory.push("🟥");
      expBox.className = "result-box wrong";
      expBox.innerHTML = `<strong>Ters Köşe! ❌</strong><br>${q.explanation}`;
      container.classList.add("shake");
    }

    expBox.style.display = "block";
    document.getElementById("actions").style.display = "none";
    document.getElementById("nextBtn").style.display = "block";
  }

  function nextQuestion() {
    currentIndex++;
    if(currentIndex < questions.length) {
      loadQuestion();
    } else {
      const { streak, stats } = updateUserData(score);
      localStorage.setItem(storageKey, JSON.stringify({ score: score, history: resultsHistory }));
      renderFinishedScreen(score, resultsHistory, streak, stats);
    }
  }
</script>

</body>
</html>
